<polygon class="uv-beam" points="112,552 198,552 222,650 88,650" fill="url(#uvBeam)"/>
<rect class="uv-glow" x="104" y="532" width="102" height="22" rx="11" fill="#c084fc" filter="url(#glow)"/>
<rect x="112" y="536" width="86" height="14" rx="7" fill="#f3e8ff" stroke="#a855f7" stroke-width="2"/>
<text x="155" y="520" class="label" style="font-weight:700;fill:#4c3a8f;font-size:14px;letter-spacing:.06em">UV LIGHT</text>
<text x="155" y="640" class="label" style="font-weight:700;fill:#1d4c51;font-size:14px;letter-spacing:.06em">WATER</text>
<rect x="76" y="476" width="158" height="16" rx="4" fill="url(#capH)"/>
<rect x="76" y="774" width="158" height="16" rx="4" fill="url(#capH)"/>

<!-- turbo + engine -->
<ellipse cx="604" cy="879" rx="100" ry="5" class="shadow"/>
<!-- engine: valve cover, cylinder head, ribbed block, sump, pulley -->
<g>
  <rect x="520" y="812" width="168" height="14" rx="7" fill="url(#head)"/>
  <g stroke="#5fa4a9" stroke-width="2"><line x1="536" y1="815" x2="536" y2="823"/><line x1="552" y1="815" x2="552" y2="823"/><line x1="568" y1="815" x2="568" y2="823"/><line x1="584" y1="815" x2="584" y2="823"/><line x1="600" y1="815" x2="600" y2="823"/><line x1="616" y1="815" x2="616" y2="823"/><line x1="632" y1="815" x2="632" y2="823"/><line x1="648" y1="815" x2="648" y2="823"/><line x1="664" y1="815" x2="664" y2="823"/></g>
  <rect x="512" y="825" width="184" height="12" rx="3" fill="#8b959a"/>
  <rect x="518" y="836" width="172" height="30" rx="4" fill="url(#block)"/>
  <g stroke="#3d464b" stroke-width="2"><line x1="532" y1="840" x2="532" y2="862"/><line x1="552" y1="840" x2="552" y2="862"/><line x1="572" y1="840" x2="572" y2="862"/><line x1="592" y1="840" x2="592" y2="862"/><line x1="612" y1="840" x2="612" y2="862"/><line x1="632" y1="840" x2="632" y2="862"/><line x1="652" y1="840" x2="652" y2="862"/><line x1="672" y1="840" x2="672" y2="862"/></g>
  <rect x="532" y="864" width="146" height="8" rx="3" fill="#3d464b"/>
  <circle cx="684" cy="850" r="11" fill="#5c666b" stroke="#3d464b" stroke-width="2"/><circle cx="684" cy="850" r="3" fill="#2a3135"/>
</g>
<!-- exhaust manifold: head to turbine; compressor outlet to engine intake -->
<path d="M596 790 L596 826" stroke="#7a6253" stroke-width="16" fill="none"/>
<path d="M518 792 L518 826" stroke="#9aa4a9" stroke-width="16" fill="none"/>
<!-- turbocharger: compressor (intake side) and turbine (exhaust side) on one shaft -->
<g>
  <rect x="540" y="759" width="34" height="18" rx="4" fill="#a7b0b5" stroke="#7e888d" stroke-width="1.5"/>
  <line x1="544" y1="768" x2="570" y2="768" stroke="#6f797f" stroke-width="3"/>
  <!-- compressor housing (cold side): volute spiral, inlet eye, wheel -->
  <circle cx="518" cy="768" r="27" fill="url(#compressor)" stroke="#7e888d" stroke-width="2"/>
  <path d="M518 745 A23 23 0 1 1 495 768" fill="none" stroke="#a9b2b7" stroke-width="3"/>
  <circle cx="518" cy="768" r="13" fill="#e3e8ea" stroke="#7e888d" stroke-width="1.5"/>
  <g class="fan" style="transform-origin:518px 768px"><path d="M518 757 L520.5 768 L518 779 L515.5 768 Z M507 768 L518 765.5 L529 768 L518 770.5 Z" fill="#6f797f"/></g>
  <!-- turbine housing (hot side) -->
  <circle cx="596" cy="768" r="25" fill="url(#turbine)" stroke="#4b3b31" stroke-width="2"/>
  <path d="M596 747 A21 21 0 1 1 575 768" fill="none" stroke="#9c8473" stroke-width="3"/>
  <circle cx="596" cy="768" r="9" fill="#5b483d" stroke="#3a2e27" stroke-width="1.5"/>
</g>
<!-- labels and step badges -->
<text x="56" y="707" class="label">Air in</text>
<text x="155" y="822" class="label">Ionizer</text>
<text x="624" y="112" class="label">Exhaust out</text>
<text x="604" y="898" class="label">Turbo and engine</text>
<g class="badge"><circle cx="52" cy="672" r="17"/><text x="52" y="678">1</text></g><g class="badge"><circle cx="262" cy="632" r="17"/><text x="262" y="638">2</text></g><g class="badge"><circle cx="292" cy="145" r="17"/><text x="292" y="151">3</text></g><g class="badge"><circle cx="520" cy="392" r="17"/><text x="520" y="398">4</text></g><g class="badge"><circle cx="470" cy="812" r="17"/><text x="470" y="818">5</text></g><g class="badge"><circle cx="572" cy="160" r="17"/><text x="572" y="166">6</text></g>
</svg>
